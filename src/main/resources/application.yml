server:
  port: 8083

spring:
  application:
    name: ticket-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pasalapeli_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  # ============================================================
  # Mensajeria asincrona (RabbitMQ en EC2-APPS) - publicacion de eventos
  # ============================================================
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:pasalapeli}
    password: ${SPRING_RABBITMQ_PASSWORD:pasalapeli123}

# Exchange central (topic) donde se publican los eventos de notificacion
notificaciones:
  exchange: ${NOTIF_EXCHANGE:pasalapeli.events}

services:
  movie-service:
    url: ${MOVIE_SERVICE_URL:http://localhost:8082}

# Actuator - healthcheck para Docker
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

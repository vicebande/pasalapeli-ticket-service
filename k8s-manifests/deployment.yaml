apiVersion: apps/v1
kind: Deployment
metadata:
  name: pasalapeli-ticket-service
  namespace: default
  labels:
    app: pasalapeli-ticket-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pasalapeli-ticket-service
  template:
    metadata:
      labels:
        app: pasalapeli-ticket-service
    spec:
      containers:
        - name: ticket-service
          image: 439738332704.dkr.ecr.us-east-1.amazonaws.com/pasalapeli-images/ticket-service:latest
          ports:
            - containerPort: 8083
          env:
            - name: ENVIRONMENT
              value: "dev"
          envFrom:
            - secretRef:
                name: pasalapeli-db-secret
            - secretRef:
                name: pasalapeli-aws-secret
            - secretRef:
                name: pasalapeli-service-urls-secret
            - secretRef:
                name: pasalapeli-internal-token-secret
          imagePullPolicy: IfNotPresent
